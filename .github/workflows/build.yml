name: Build Hortator Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget unzip git python3 python3-pip
          pip3 install Pillow

      - name: Install JieLi toolchain
        run: |
          if [ -f tools/get_toolchain.sh ]; then
            chmod +x tools/get_toolchain.sh
            ./tools/get_toolchain.sh
          fi

      - name: Clone JieLi AC79 SDK
        run: |
          if [ ! -f "$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot" ]; then
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/JieLi-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" || \
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://github.com/jieli-tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
          fi
          test -f "$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot"

      - name: Build .fwsc firmware
        run: |
          chmod +x ./build.sh
          DRUM_PACKAGE=1 ./build.sh
          ls -lh build/*.fwsc

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: hortator-custom-fwsc
          path: build/*.fwsc
          retention-days: 30

name: Build Hortator Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget unzip git python3 python3-pip
          pip3 install Pillow

      - name: Install JieLi toolchain and SDK
        run: |
          if [ -f tools/get_toolchain.sh ]; then
            chmod +x tools/get_toolchain.sh
            ./tools/get_toolchain.sh
          fi

      - name: Build .fwsc firmware
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Locate generated .fwsc file
        id: find_fw
        run: |
          FW_FILE=$(find . -maxdepth 4 -name "*.fwsc" | head -n 1)
          if [ -z "$FW_FILE" ]; then
            echo "No .fwsc file found after build!"
            exit 1
          fi
          echo "fw_path=$FW_FILE" >> "$GITHUB_OUTPUT"
          echo "Found firmware: $FW_FILE"

      - name: Upload .fwsc artifact
        uses: actions/upload-artifact@v4
        with:
          name: hortator-custom-fwsc
          path: ${{ steps.find_fw.outputs.fw_path }}
          retention-days: 30

name: Build Hortator Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget unzip git python3 python3-pip
          pip3 install Pillow

      - name: Install JieLi toolchain
        run: |
          if [ -f tools/get_toolchain.sh ]; then
            chmod +x tools/get_toolchain.sh
            ./tools/get_toolchain.sh
          fi

      - name: Clone JieLi AC79 SDK
        run: |
          if [ ! -f "$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot" ]; then
            git clone --depth 1 https://gitee.com/JieLi-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" || \
            git clone --depth 1 https://github.com/jieli-tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
          fi
          test -f "$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot"

      - name: Build firmware
        run: |
          set -o pipefail
          chmod +x ./build.sh
          ./build.sh | tee build.log

      - name: Collect generated .fwsc firmware
        run: |
          mkdir -p out_fw
          PKG_PATH=$(awk '/^package[[:space:]]+/ {print $2}' build.log | tail -n 1)
          if [ -n "$PKG_PATH" ] && [ -f "$PKG_PATH" ]; then
            cp "$PKG_PATH" out_fw/
          fi
          if [ -z "$(ls -A out_fw)" ]; then
            find "$HOME" /tmp -maxdepth 5 -type f -name "*.fwsc" -exec cp {} out_fw/ \; 2>/dev/null || true
          fi
          ls -lh out_fw/
          test -n "$(ls -A out_fw)"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: hortator-custom-fwsc
          path: out_fw/
          retention-days: 30
